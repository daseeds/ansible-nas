# Add your all.yml config overrides to this file. See group_vars/all.yml for all possible settings.

# Example options
ansible_nas_hostname: athena
ansible_nas_timezone: Europe/Paris

## Enable some applications
homepage_enabled: true

# Will be added to the docker group to give user command line access to docker
ansible_nas_user: daseeds

# Your email and domain, used for Let's Encrypt SSL certs
ansible_nas_email: cyril.jean@gmail.com

# Applications will have subdomain SSL certificates created if Traefik is enabled, e.g. ansible-nas.<your-domain>, nextcloud.<your-domain>
ansible_nas_domain: hivehub.fr

docker_home: /home/ansible-nas/docker
zfs_root: /main_pool
samba_shares_root: "{{ zfs_root }}/share"
nfs_shares_root: "{{ zfs_root }}/share"


downloads_root: "{{ samba_shares_root }}/downloads"

# Where your movies are stored
movies_root: "{{ samba_shares_root }}/movies"

# Where your TV episodes are stored
tv_root: "{{ samba_shares_root }}/tv"

# Where torrent files are stored (picked up by Transmission for downloading)
torrents_root: "{{ samba_shares_root }}/torrents"

# Where music is stored
music_root: "{{ samba_shares_root }}/music"

# Where podcasts are stored
podcasts_root: "{{ samba_shares_root }}/podcasts"

# Where your books are stored
books_root: "{{ samba_shares_root }}/books"

# Where your audiobooks are stored
audiobooks_root: "{{ samba_shares_root }}/audiobooks"

# Where your comics are stored
comics_root: "{{ samba_shares_root }}/comics"

# Where photos are stored
photos_root: "{{ samba_shares_root }}/photos"

# Where paperless_ng consumes documents
documents_root: "{{ samba_shares_root }}/documents"

# Where personal repos and code are stored
code_root: "{{ samba_shares_root }}/code"

# Where roms are stored
roms_root: "{{ samba_shares_root }}/roms"

# Where video and audio recordings are stored
recordings_root: "{{ samba_shares_root }}/recordings"

# The description that'll appear next to your Ansible-NAS box when browsing your network
samba_server_string: Ansible NAS

# Shares you want published over Samba.
samba_shares:
  - name: downloads
    comment: "Stuff downloaded"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ downloads_root }}"

  - name: movies
    comment: "Movies"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ movies_root }}"

  - name: tv
    comment: "TV Episodes"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ tv_root }}"

  - name: music
    comment: "Music"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ music_root }}"

  - name: podcasts
    comment: "Podcasts"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ podcasts_root }}"

  - name: dump
    comment: "File dump"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ samba_shares_root }}/dump"

  - name: games
    comment: "Games"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ samba_shares_root }}/games"

  - name: photos
    comment: "Pictures"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ photos_root }}"

  - name: books
    comment: "Books"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ books_root }}"

  - name: audiobooks
    comment: "Audiobooks"
    guest_ok: yes
    public: yes
    writable: yes
    browsable: yes
    path: "{{ audiobooks_root }}"

  - name: comics
    comment: "Comics"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ comics_root }}"

  - name: documents
    comment: "Documents"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ documents_root }}"

  - name: code
    comment: "Code"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ code_root }}"

  - name: recordings
    comment: "Recordings"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ recordings_root }}"

###
### NFS
###
# Data you want published over NFS. More info on the NFS config format can be found at
# https://help.ubuntu.com/community/SettingUpNFSHowTo#Shares
# WARNING: Weird things might happen if you share the same data over Samba and NFS and allow writes on both!

nfs_exports:
  - "{{ nfs_shares_root }}/public *(rw,sync,no_root_squash)"

###
### Samba
###
# Seems to break browsing of the \\server-name shares root when enabled
samba_mitigate_cve_2017_7494: false

# Enable apple extensions for compatibility with apple clients
samba_apple_extensions: yes

# The account used when Samba shares are accessed. Shouldn't need to change this unless you want to
# mess with Samba user permissions.
samba_guest_account: ansible-nas

# How Samba behaves when an unknown user connects, see Samba docs for more info
samba_map_to_guest: Bad Password

# The NetBIOS hostname used by Samba on your network
samba_netbios_name: "{{ ansible_nas_hostname }}"


# Applications
jellyfin_enabled: true
radarr_enabled: true
overseerr_enabled: false
bazarr_enabled: true
homeassistant_enabled: true
glances_enabled: true
speedtest_enabled: true
traefik_enabled: false
logging_stack_enabled: false
cloudflare_ddns_enabled: false
syncthing_enabled: false
stats_enabled: false
n8n_enabled: false
newt_enabled: false
flaresolverr_enabled: true
utorrent_enabled: false
qbittorrent_enabled: true
prowlarr_enabled: true
lidarr_enabled: true
jellyseerr_enabled: true
sonarr_enabled: true
musicassistant_enabled: true
xyops_enabled: true
xyops_hostname: "xyops.lan"
nextcloud_aio_enabled: false
matter_enabled: true

restic_enabled: false
restic_aws_region: eu-west-3
restic_repository: s3:https://s3.amazonaws.com/bucelle-immich-backup

immich_enabled: true
immich_db_data_location: "{{ docker_home }}/immich_db"
immich_upload_location: "{{ zfs_root }}/immich/content"
immich_available_externally: true

portainer_enabled: true
portainer_port: "9001"


ansible_nas_extra_packages:
  - smartmontools
  - htop
  - zfsutils-linux
  - bonnie++
  - unzip
  - lm-sensors
  - cron
  - iotop
  - hdparm

#Backup with restic

restic_create_schedule: true
restic_repos:
  # aws:
  #   location: "{{ restic_repository }}"
  #   password: "{{ restic_password }}"
  #   init: true
  #   aws_access_key: "{{ restic_key_id }}"
  #   aws_secret_access_key: "{{ restic_key }}"
  #   aws_default_region: "{{ restic_aws_region }}"
  borgbase:
    location: "{{ borg_repo }}"
    password: "{{ borg_restic }}"
    init: false
restic_backups:
  immich_media:
    name: immich_media
    repo: borgbase
    src: "{{ immich_upload_location }}"
    scheduled: true
    schedule_oncalendar: '*-*-* 01:30:00'
    niceness: 10
    exclude:
        exclude:
          - "{{ immich_upload_location }}/thumbs"
          - "{{ immich_upload_location }}/encoded-video"
  immich_database:
    name: immich_database
    repo: borgbase
    stdin: true
    stdin_cmd: docker exec -t immich_db pg_dumpall --clean --if-exists --username=postgres | gzip
    stdin_filename: dump.sql.gz
    scheduled: true
    schedule_oncalendar: '*-*-* 01:00:00'
    niceness: 10


