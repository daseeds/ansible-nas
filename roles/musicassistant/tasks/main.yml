---
- name: Start musicassistant
  block:
    - name: Create Music Assistant Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ musicassistant_data_directory }}/config"

    - name: Home Music Docker Container
      community.docker.docker_container:
        name: "{{ musicassistant_container_name }}"
        image: "{{ musicassistant_image_name }}:{{ musicassistant_image_version }}"
        pull: true
        volumes:
          - "{{ musicassistant_data_directory }}/config:/config:rw"
        network_mode: host
        restart_policy: unless-stopped
        memory: "{{ musicassistant_memory }}"
        security_opts:
          - apparmor:unconfined
        capabilities:
          - SYS_ADMIN
          - DAC_READ_SEARCH
        env:
          TZ: "{{ ansible_nas_timezone }}"
          LOG_LEVEL: "info"
  when: musicassistant_enabled is true

- name: Stop musicassistant
  block:
    - name: Stop musicassistant
      community.docker.docker_container:
        name: "{{ musicassistant_container_name }}"
        state: absent
  when: musicassistant_enabled is false
